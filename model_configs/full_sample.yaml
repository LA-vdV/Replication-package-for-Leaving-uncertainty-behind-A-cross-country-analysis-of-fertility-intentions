# Random Forest Model Configuration: Full Sample
# This config contains all information needed for model replication

model:
  name: "full_sample"   
  description: "Individuals age 20-49, any # of children random forest model. Base"
  model_type: "rf" 
  
# Data sample definition
sample:
  type: "full_sample"  # full_sample, only_yc, custom
  filters:
    age_broad: 1
    has_demo: 1  
    has_fer: 1
    same_sex_partner: 0
    partner: ["2-Married", "1-Partner"]
  additional_filters: {}
      
# Features for the model
features:
  categorical:
    - "cn"
    - "educ_own" 
    - "empl_lv"
    - "educ_partner"
    - "child_few"
    - "subj_health"
    - "religious"
    - "female"
    - "migrant"
    - "earnings"
    - "happy"
    - "trust"
    - "future_plan"
    - "want_move"
    - "isowner"
    - "empl_partner"
    - "partner"
    - "missing_children"
    
  continuous:
    - "age"
    - "age_partner" 
    - "std_tv_deaths"

# Target variable
target:
  column: "fer_short2"
  encoding:
    "Definitely not": 1
    "Probably not": 1
    "Unsure": 2
    "Probably yes": 3
    "Definitely yes": 3
    "Currently expecting a child": null

# Data paths  
data:
  source_file: "../../replication_data/data_ready2.dta"
  processed_data: "../../replication_output/processed_data.pkl"  # Shared across models
  
# Output configuration
output:
  base_path: "../../replication_output"
  model_folder: "full_sample"  # It helps if this matches the model name
  files:
    model: "f1_couples.pkl"
    config: "analysis_config.yaml" 
    hyperparameters: "best_hyperparameters.pkl"
    hyperparameter_results: "f1_hyperparameters.csv"
    feature_names: "feature_names.pkl"
    evaluation: "evaluation_results.csv"
    permutation_importance: "permutation_importance.csv"
    pdp_1d: "pdp_1d_results.csv"
    pdp_2d: "pdp_2d_results.csv"

# Model training configuration
training:
  hyperparameter_tuning:
    n_iterations: 10
    n_iter_search: 50
    scoring_metric: "f1_macro"
    random_state: 1500
  
  final_model:
    random_state: 42


# Analysis configuration  
analysis:
  evaluation:
    permutation_importance:
      n_repeats: 10
      random_state: 42
  
  interpretation:  
    interaction_analysis:
      max_features: 21
      grid_size_2d: 15
    partial_dependence:
      grid_resolution: 10
      custom_grids:
        std_tv_deaths: [-0.75, 0, 0.75, 1.5, 2.25, 3.0]
      
  evaluation:
    metrics: ["accuracy", "precision", "recall", "f1", "confusion_matrix"]
    permutation_importance:
      n_repeats: 20
      random_state: 42
      
# Metadata  
metadata:
  created_date: "2026-10-30"
  created_by: "Lucas"
  description: "Random Forest model for fertility intentions analysis - full sample"
  version: "2.0"